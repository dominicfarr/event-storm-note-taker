# from dominicfarr/dev-standards@31ed71cb9636057c6931dbcf137d688b8c404c32
# Base gates. Every hook is pinned by rev: set revs with `pre-commit autoupdate`,
# never by hand. Any hook that fails or changes files stops the commit: review,
# `git add -u`, commit again. Stacks merge their hook fragment into this file.
default_install_hook_types: [pre-commit, commit-msg]
default_stages: [pre-commit]

repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks

  # actionlint only runs shellcheck on workflow scripts when shellcheck is on
  # PATH, so shellcheck is a documented prerequisite as well as a hook.
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint
        # Also lint workflow templates under templates/, where the standards
        # repo keeps its Sonar workflow so it never runs. A no-op elsewhere.
        files: ^(\.github/workflows/|templates/.*\.ya?ml$)

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1-1
    hooks:
      - id: shellcheck

  # Commit-message linter. pre-commit provisions Node for it, so the project
  # needs no npm. The rules live in commitlint.config.mjs; see CONTRIBUTING.md.
  - repo: https://github.com/alessandrojcm/commitlint-pre-commit-hook
    rev: v9.27.0
    hooks:
      - id: commitlint
        stages: [commit-msg]
        # Pass the message file explicitly, so the hook also works with
        # `pre-commit run --hook-stage commit-msg --commit-msg-filename <file>`.
        pass_filenames: true
        # Keep this on the same major version as the @commitlint/cli the
        # hook's rev ships (`npm view @commitlint/config-conventional version`).
        additional_dependencies: ["@commitlint/config-conventional@21.2.4"]

# from dominicfarr/dev-standards@31ed71cb9636057c6931dbcf137d688b8c404c32
# JS/TS (Svelte) hook fragment. Append this file to the end of the project's
# .pre-commit-config.yaml (its entries sit under the base `repos:`), with
# <sha> above filled in with the standards repo commit it was copied from.
# Every hook runs the project's own tools from its npm lockfile through
# `npx --no-install` (ADR 0001), so install them as devDependencies first:
# eslint, prettier, svelte-check, typescript and vitest.
# `language: unsupported` needs pre-commit 4.4.0 or later. Any hook that fails
# or changes files stops the commit: review, `git add -u`, commit again.
  - repo: local
    hooks:
      - id: eslint
        name: eslint --fix
        entry: npx --no-install eslint --fix --max-warnings=0 --no-warn-ignored
        language: unsupported
        types_or: [javascript, ts, svelte]
        require_serial: true
      - id: prettier
        name: prettier
        entry: npx --no-install prettier --write --ignore-unknown
        language: unsupported
        types: [text]
        exclude: ^package-lock\.json$
      # Checks the whole project, not the staged files. Point --tsconfig at
      # the config that includes your app's .ts and .svelte files.
      - id: svelte-check
        name: svelte-check
        entry: npx --no-install svelte-check --tsconfig ./tsconfig.json --fail-on-warnings
        language: unsupported
        types_or: [javascript, ts, svelte, json]
        pass_filenames: false
      - id: vitest-related
        name: vitest related
        entry: npx --no-install vitest related --run --passWithNoTests
        language: unsupported
        types_or: [javascript, ts, svelte]
